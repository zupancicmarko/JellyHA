session_control:
  name: Session Control
  description: Send a control command to a Jellyfin playback session (Pause, Unpause, Stop).
  fields:
    session_id:
      name: Session ID
      description: The ID of the Jellyfin session to control.
      required: true
      selector:
        text:
    command:
      name: Command
      description: The control command to send.
      required: true
      selector:
        select:
          options:
            - label: Pause
              value: Pause
            - label: Unpause
              value: Unpause
            - label: TogglePause
              value: TogglePause
            - label: Stop
              value: Stop
            - label: Next Track
              value: NextTrack
            - label: Previous Track
              value: PreviousTrack
            - label: Shuffle
              value: Shuffle
            - label: Set Repeat Mode
              value: SetRepeatMode
    config_entry_id:
      name: JellyHA Instance
      description: The JellyHA instance to use (defaults to first available)
      required: false
      selector:
        config_entry:
          integration: jellyha
    entity_id:
      name: JellyHA Entity
      description: The JellyHA entity to target (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha
    server_entity_id:
      name: JellyHA Server Entity
      description: The JellyHA entity to target (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha

session_play:
  name: Session Play
  description: Instruct an active Jellyfin client session or device player to play a media item (Movie, Episode, Song, etc.).
  fields:
    item_id:
      name: Item ID
      description: The Jellyfin item ID to play.
      required: true
      selector:
        text:
    entity_id:
      name: Player Entity
      description: The JellyHA media player entity to target (e.g. media_player.jellyha_android_tv).
      required: false
      selector:
        entity:
          domain: media_player
    device_name:
      name: Device Name
      description: The name of the client device (e.g. "Android TV").
      required: false
      selector:
        text:
    device_id:
      name: Device ID
      description: The unique device ID of the client session.
      required: false
      selector:
        text:
    client:
      name: Client Name
      description: The client application name (e.g. "Wholphin", "Jellyfin Web").
      required: false
      selector:
        text:
    session_id:
      name: Session ID
      description: The direct Jellyfin session ID (optional).
      required: false
      selector:
        text:
    play_command:
      name: Play Command
      description: How to play the item (PlayNow, PlayNext, PlayLast). Default is PlayNow.
      required: false
      selector:
        select:
          options:
            - label: Play Now
              value: PlayNow
            - label: Play Next
              value: PlayNext
            - label: Play Last
              value: PlayLast
    start_position_ticks:
      name: Start Position Ticks
      description: Optional start position in ticks (1 second = 10,000,000 ticks).
      required: false
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      name: JellyHA Instance
      description: The JellyHA instance to use (defaults to first available)
      required: false
      selector:
        config_entry:
          integration: jellyha
    server_entity_id:
      name: JellyHA Server Entity
      description: The JellyHA entity to target (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha

session_seek:
  name: Session Seek
  description: Seek to a specific position in a Jellyfin playback session.
  fields:
    session_id:
      name: Session ID
      description: The ID of the Jellyfin session to control.
      required: true
      selector:
        text:
    position_ticks:
      name: Position Ticks
      description: The position in ticks (1 second = 10,000,000 ticks). Either position_ticks or position_seconds is required.
      required: false
      selector:
        number:
          min: 0
          mode: box
    position_seconds:
      name: Position Seconds
      description: The position in seconds. Automatically converted to ticks.
      required: false
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      name: JellyHA Instance
