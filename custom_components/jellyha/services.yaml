search:
  name: Search
  description: Search for media in Jellyfin library and return Item IDs.
  fields:
    query:
      name: Search Query
      description: The text to search for (e.g. "Matrix", "Batman").
      required: false
      selector:
        text:
    media_type:
      name: Media Type
      description: Filter by media type.
      required: false
      selector:
        select:
          options:
            - label: Movie
              value: Movie
            - label: Series
              value: Series
            - label: Episode
              value: Episode
            - label: Audio (Song)
              value: Audio
            - label: Music Album
              value: MusicAlbum
            - label: Music Artist
              value: MusicArtist
            - label: Music Video
              value: MusicVideo
            - label: Video (Home Video)
              value: Video
            - label: Playlist
              value: Playlist
            - label: Collection (BoxSet)
              value: BoxSet
    sort_by:
      name: Sort By
      description: Field to sort results by (default Date Added).
      required: false
      selector:
        select:
          options:
            - label: Date Added (Default)
              value: DateCreated
            - label: Title / Name
              value: SortName
            - label: Release Date
              value: PremiereDate
            - label: Rating
              value: CommunityRating
            - label: Episode / Track Number
              value: IndexNumber
            - label: Recently Played
              value: DatePlayed
            - label: Play Count
              value: PlayCount
            - label: Random / Shuffle
              value: Random
    sort_order:
      name: Sort Order
      description: Order of sorted results (default Descending).
      required: false
      selector:
        select:
          options:
            - label: Descending
              value: Descending
            - label: Ascending
              value: Ascending
    parent_id:
      name: Parent / Series ID
      description: Filter media within a specific TV Series, Season, or Album ID.
      required: false
      selector:
        text:
    is_played:
      name: Is Watched
      description: Filter by watched status.
      required: false
      selector:
        boolean:
    is_favorite:
      name: Is Favorite
      description: Filter by favorite status.
      required: false
      selector:
        boolean:
    genre:
      name: Genre
      description: Filter by genre (e.g. "Action", "Comedy").
      required: false
      selector:
        text:
    year:
      name: Year
      description: Filter by release year.
      required: false
      selector:
        number:
          min: 1900
          max: 2030
          mode: box
    min_rating:
      name: Min Rating
      description: Filter by minimum community rating (0-10).
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    official_rating:
      name: Parental / Content Rating
      description: Filter by certification (e.g. "PG", "PG-13", "R", "TV-MA").
      required: false
      selector:
        text:
    studio:
      name: Studio / Network
      description: Filter by studio or network (e.g. "Pixar", "HBO", "Marvel Studios").
      required: false
      selector:
        text:
    person:
      name: Person (Actor / Director)
      description: Filter media featuring a specific actor or director (e.g. "Tom Hanks").
      required: false
      selector:
        text:
    season:
      name: Season Number
      description: Filter by season number (ParentIndexNumber).
      required: false
      selector:
        number:
          min: 0
          mode: box
    episode:
      name: Episode Number
      description: Filter by episode number (IndexNumber).
      required: false
      selector:
        number:
          min: 1
          mode: box
    offset:
      name: Offset
      description: Number of items to skip (for pagination).
      required: false
      selector:
        number:
          min: 0
          mode: box
    limit:
      name: Limit
      description: Maximum number of results to return (default 5).
      required: false
      selector:
        number:
          min: 1
          max: 50
          mode: box
    config_entry_id:
      name: JellyHA Instance
      description: The JellyHA instance to search (defaults to first available)
      required: false
      selector:
        config_entry:
          integration: jellyha
    entity_id:
      name: JellyHA Entity
      description: The JellyHA entity to target (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha
    server_entity_id:
      name: JellyHA Server Entity
      description: The JellyHA entity to target (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha

