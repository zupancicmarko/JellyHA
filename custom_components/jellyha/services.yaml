play_on_chromecast:
  name: Play on Chromecast
  description: Play a Jellyfin item on a Chromecast device
  fields:
    entity_id:
      name: Media Player
      description: The Chromecast media player entity
      required: true
      selector:
        entity:
          domain: media_player
    item_id:
      name: Item ID
      description: Jellyfin item ID to play
      required: true
      selector:
        text:
    config_entry_id:
      name: JellyHA Instance
      description: The JellyHA instance to use (defaults to first available)
      required: false
      selector:
        config_entry:
          integration: jellyha
    server_entity_id:
      name: JellyHA Server Entity
      description: The JellyHA entity providing the media (optional, alternative to config_entry_id)
      required: false
      selector:
        entity:
          integration: jellyha
    use_series_image:
      name: Use Series Poster
      description: For TV episodes, send the official Series vertical poster to Chromecast instead of the episode screenshot
      required: false
      default: true
      selector:
        boolean:
    subtitle_mode:
      name: Subtitle Mode
      description: Subtitle selection strategy (auto, none, forced_only, custom)
      required: false
      default: auto
      selector:
        select:
          options:
            - label: Auto (Jellyfin Profile)
              value: auto
            - label: None (Disabled)
              value: none
            - label: Forced Only
              value: forced_only
            - label: Custom Language List
              value: custom
    subtitle_language:
      name: Subtitle Languages
      description: Prioritized comma-separated list of subtitle language codes or names (e.g. "sl, en" or "slv, eng")
      required: false
      selector:
        text:
    subtitle_index:
      name: Subtitle Stream Index
      description: Direct subtitle stream index to force a specific subtitle track
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box


