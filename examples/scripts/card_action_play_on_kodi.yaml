# ==============================================================================
# JellyHA Script Example: Card Click Action -> Play on Kodi
# ==============================================================================
# Description:
#   Handles playback routing when a user clicks, holds, or double-taps a poster
#   in the JellyHA Library Card, sending the selected media to a Kodi media center.
#
# Prerequisites (Home Assistant & Kodi Setup):
# --------------------------------------------
# 1. Install the "Kodi" integration in Home Assistant:
#      - Go to Settings -> Devices & Services -> Add Integration -> Kodi
#      - Follow prompts to connect to your Kodi instance (e.g. media_player.kodi)
#
# 2. Recommended Kodi Add-on (JellyCon or Jellyfin for Kodi):
#      - If you have the "JellyCon" add-on installed on Kodi, this script triggers
#        instant direct playback using Kodi's plugin URL scheme:
#          plugin://plugin.video.jellycon/?mode=PLAY&id={item_id}
#      - If using the standard "Jellyfin for Kodi" add-on:
#          plugin://plugin.video.jellyfin/?mode=play.media&id={item_id}
#      - Alternatively, Kodi can open the direct Jellyfin web/stream URL.
#
# Card Configuration (Lovelace YAML):
# -----------------------------------
# type: custom:jellyha-library-card
# entity: sensor.jellyha_library
# title: "Movies & TV"
# click_action: call-service
# click_service: script.card_action_play_on_kodi
#
# Variables Injected Automatically by JellyHA Library Card:
# ---------------------------------------------------------
# When 'click_action: call-service' is configured, the JellyHA card calls the
# script and injects all media metadata directly into the Jinja template namespace:
#
#   - title / name: Media title ("Inception" or "Episode 1")
#   - media_type: "Movie", "Series", "Episode", or "Audio"
#   - series_name: Show name if episode ("Severance")
#   - series_id: Show GUID
#   - season: Season number (e.g. 1)
#   - episode: Episode number (e.g. 4)
#   - year: Release year (e.g. 2025)
#   - item_id: Jellyfin GUID
#   - poster_url: Authenticated proxy poster image URL
#   - series_poster_url: Parent series poster cover URL (episodes)
#   - backdrop_url: Fanart background image URL
#   - overview / description: Plot synopsis
#   - dynamic_range: Dynamic range string ("SDR", "HDR10", "Dolby Vision", "HLG")
#   - runtime_minutes: Runtime duration in minutes
#   - jellyfin_url: Direct URL to item in Jellyfin web client
#   - config_entry_id: Target JellyHA instance ID
#   - action_type: "click", "hold", or "double_tap"
# ==============================================================================

alias: "JellyHA: Play on Kodi (Script)"
description: "Handles playback routing from JellyHA Library Card click actions to Kodi."
mode: queued
max: 5
icon: mdi:kodi

fields:
  item_id:
    name: Item ID
    description: Jellyfin media item ID
    required: false
    example: "49ed9530ac681f148ca09b91ca7010c8"
    selector:
      text:
  title:
    name: Title
    description: Media title
    required: false
    example: "Inception"
    selector:
      text:
  media_type:
    name: Media Type
    description: Type of media (Movie, Episode, Series)
    required: false
    default: "Movie"
    selector:
      text:
  series_name:
    name: Series Name
    description: Parent TV series name (if episode)
    required: false
    selector:
      text:
  season:
    name: Season
    description: Season number
    required: false
    selector:
      number:
        min: 1
        max: 100
  episode:
    name: Episode
    description: Episode number
    required: false
    selector:
      number:
        min: 1
        max: 1000
  year:
    name: Year
    description: Release year
    required: false
    selector:
      number:
        min: 1900
        max: 2050
  jellyfin_url:
    name: Jellyfin URL
    description: Direct web client URL to media item
    required: false
    selector:
      text:
  target_entity:
    name: Target Kodi Entity
    description: Entity ID of target Kodi media player
    required: false
    default: "media_player.kodi"
    selector:
      entity:
        domain: media_player

sequence:
  # Determine target Kodi player entity
  - variables:
      kodi_player: >-
        {{ target_entity | default('media_player.kodi') }}

  - choose:
      # ------------------------------------------------------------------------
      # Case A: Media item provided (from JellyHA Library Card click)
      # ------------------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ item_id is defined and item_id not in [none, '', 'None'] }}"
        sequence:
          # Informational log in Home Assistant Logbook
          - action: logbook.log
            data:
              name: "JellyHA Kodi Player"
              message: >-
                Playing {{ media_type | default('Media') }}: {{ title | default(item_id) }} {% if year %}({{ year }}){% endif %} on {{ kodi_player }}
              domain: media_player
              entity_id: "{{ kodi_player }}"

          - choose:
              # Option 1: Kodi JSON-RPC Player.Open via JellyCon plugin URL (Recommended)
              - conditions:
                  - condition: template
                    value_template: "{{ is_service('kodi.call_method') }}"
                sequence:
                  - action: kodi.call_method
                    target:
                      entity_id: "{{ kodi_player }}"
                    data:
                      method: Player.Open
                      item:
                        file: "plugin://plugin.video.jellycon/?mode=PLAY&id={{ item_id }}"

              # Option 2: Fallback to standard Home Assistant media_player.play_media
              - conditions: []
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ kodi_player }}"
                    data:
                      media_content_type: video
                      media_content_id: >-
                        {{ jellyfin_url if (jellyfin_url is defined and jellyfin_url) else ('plugin://plugin.video.jellycon/?mode=PLAY&id=' ~ item_id) }}

      # ------------------------------------------------------------------------
      # Case B: No item provided (user clicked "Run" directly in HA Scripts UI)
      # Resume / unpause active Kodi playback
      # ------------------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ item_id is not defined or item_id in [none, '', 'None'] }}"
        sequence:
          - action: logbook.log
            data:
              name: "JellyHA Kodi Player"
              message: "Resume / Unpause playback on {{ kodi_player }}"
              domain: media_player
              entity_id: "{{ kodi_player }}"

          - action: media_player.media_play_pause
            target:
              entity_id: "{{ kodi_player }}"
