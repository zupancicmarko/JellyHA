# ==============================================================================
# JellyHA Dashboard Examples: Now Playing Card Configurations
# ==============================================================================
# Below are curated examples for custom:jellyha-now-playing-card as well as
# popular community media player cards supported out of the box in v1.3.0+.
#
# Note: Starting in v1.3.0, media_player.jellyha_<user> is the preferred entity.
# Legacy sensor.jellyha_now_playing_<user> remains supported for backward compatibility.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Full Fanart Backdrop (Rich Cinematic Display)
# ------------------------------------------------------------------------------
type: custom:jellyha-now-playing-card
entity: media_player.jellyha_admin # Replace with your user media player
title: "Now Watching"
show_background: true
show_title: true
show_subtitle: true
show_client: true
show_user: true
show_time: true
show_media_type_badge: true
show_genres: true
show_ratings: true
show_runtime: true
show_year: true

# ------------------------------------------------------------------------------
# 2. Compact Minimal Card (Sidebar or Mobile Dashboard)
# ------------------------------------------------------------------------------
type: custom:jellyha-now-playing-card
entity: media_player.jellyha_admin
show_background: false
show_title: true
show_subtitle: true
show_client: false
show_user: false
show_time: true
show_media_type_badge: false
show_genres: false
show_ratings: false

# ------------------------------------------------------------------------------
# 3. Multi-Instance Setup Example
# ------------------------------------------------------------------------------
# When running multiple JellyHA servers (e.g. Movies instance and Music instance),
# target each card explicitly to the instance's user media player:
type: vertical-stack
cards:
  - type: custom:jellyha-now-playing-card
    entity: media_player.jellyha_movies_admin
    title: "Movies Server"
    show_background: true
  - type: custom:jellyha-now-playing-card
    entity: media_player.jellyha_music_admin
    title: "Music Server"
    show_background: false

# ------------------------------------------------------------------------------
# 4. Community Card: Mini Media Player (HACS)
# ------------------------------------------------------------------------------
# Works 100% natively with media_player.jellyha_* including artwork, progress,
# volume controls, shuffle, repeat, and transport buttons.
type: custom:mini-media-player
entity: media_player.jellyha_admin
artwork: full-cover
info: scroll
sound_mode: full
hide:
  volume: false
  power: true

# ------------------------------------------------------------------------------
# 5. Community Card: Mushroom Media Card (HACS)
# ------------------------------------------------------------------------------
# Seamlessly displays artist, album, media title, and controls.
type: custom:mushroom-media-player-card
entity: media_player.jellyha_admin
use_media_artwork: true
show_volume_level: true
media_controls:
  - on_off
  - shuffle
  - previous
  - play_pause_stop
  - next
  - repeat
