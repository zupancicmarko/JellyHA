# ==============================================================================
# JellyHA Automation Example: Play Random Unwatched Movie
# ==============================================================================
# Description:
#   Searches your Jellyfin library dynamically using the `jellyha.search` service,
#   finds unwatched movies matching specific criteria (e.g. year and minimum rating),
#   picks a random match, and casts it directly to a Chromecast or media player.
# ==============================================================================

alias: "JellyHA: Play Random Top Movie"
description: "Plays a random unwatched movie from 2025 with a rating above 7"
mode: restart
max_exceeded: silent

trigger:
  - trigger: event
    event_type: call_service
    event_data:
      domain: automation
      service: trigger
      service_data:
        entity_id: automation.jellyha_play_random_top_movie

actions:
  # 1. Search for unwatched candidates
  - action: jellyha.search
    data:
      media_type: Movie
      is_played: false
      year: 2025
      min_rating: 7
      limit: 50
      # config_entry_id: "abc123"  # Optional: target a specific JellyHA instance in multi-instance setups
    response_variable: search_result

  # 2. Check if any movies matched the search
  - if:
      - condition: template
        value_template: "{{ search_result['items'] | count > 0 }}"
    then:
      # 3. Pick a random item from the list and play it on Chromecast
      - action: jellyha.play_on_chromecast
        data:
          entity_id: media_player.office_tv
          item_id: "{{ (search_result['items'] | random)['id'] }}"
    else:
      # 4. Notify if nothing was found
      - action: notify.persistent_notification
        data:
          title: "JellyHA Movie Picker"
          message: "No unwatched 2025 movies with rating > 7 found."
