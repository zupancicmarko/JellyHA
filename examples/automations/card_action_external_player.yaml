# ========================================================================
# JellyHA Example: Card Click Action -> External Player (Plex / Kodi / Apple TV)
# ========================================================================
#
# Use case:
# You love browsing your library with JellyHA Library Card in Home Assistant,
# but want clicking/tapping a movie or episode to start playback on another
# player or service (e.g. Apple TV, Plex, Kodi, Infuse, etc.).
#
# Card Configuration (Lovelace YAML):
# -----------------------------------
# type: custom:jellyha-library-card
# name: Movies
# library_type: Movies
# click_action: call-service
# click_service: script.play_on_apple_tv
# # Optional: hold_action or double_tap_action can also call services!
# hold_action: call-service
# hold_service: script.play_on_kodi
#
# ========================================================================
# Approach 1: Reusable Script (Recommended)
# ========================================================================
# When 'click_action: call-service' is configured with 'script.play_on_apple_tv',
# the JellyHA card calls the script directly and injects all media metadata
# into the script's Jinja namespace as variables:
#
#   - title / name: Media title ("Inception" or "Episode 1")
#   - media_type: "Movie", "Series", "Episode", or "Audio"
#   - series_name: Show name if episode ("Severance")
#   - series_id: Show GUID
#   - season: Season number (e.g. 1)
#   - episode: Episode number (e.g. 4)
#   - year: Release year (e.g. 2025)
#   - item_id: Jellyfin GUID
#   - poster_url: Authenticated proxy poster image URL
#   - series_poster_url: Parent series poster cover URL (episodes)
#   - backdrop_url: Fanart background image URL
#   - date_created / date_added: ISO date added to Jellyfin
#   - last_played_date: Timestamp of last playback (or null)
#   - artist / artist_name: Track / album artist (music)
#   - album: Album name (music)
#   - album_artist: Primary album artist (music)
#   - overview / description: Plot synopsis
#   - official_rating: Age certification (e.g. "PG-13", "TV-MA")
#   - rating: Community rating score (0.0 to 10.0)
#   - genres: Array of genres (e.g. ["Sci-Fi", "Drama"])
#   - is_played: Boolean (true if watched)
#   - is_favorite: Boolean (true if favorited)
#   - runtime_minutes: Runtime duration in minutes
#   - jellyfin_url: Direct URL to item in Jellyfin web client
#   - action_type: "click", "hold", or "double_tap"
#
# ------------------------------------------------------------------------

sequence:
  - choose:
      # If it's a TV Show episode
      - conditions:
          - condition: template
            value_template: "{{ media_type == 'Episode' }}"
        sequence:
          - action: logbook.log
            data:
              name: "JellyHA Player"
              message: "Playing {{ series_name }} S{{ '%02d' % (season | default(1) | int) }}E{{ '%02d' % (episode | default(1) | int) }} - {{ title }}"
          
          # Example A: Search and play in Plex / Infuse / Kodi
          # For Kodi via JSON-RPC / VideoLibrary:
          # - action: kodi.call_method
          #   target:
          #     entity_id: media_player.kodi_living_room
          #   data:
          #     method: Player.Open
          #     item:
          #       file: "{{ jellyfin_url }}"

          # Example B: Send title to Apple TV / Infuse deep-link
          - action: media_player.play_media
            target:
              entity_id: media_player.living_room_apple_tv
            data:
              media_content_type: episode
              media_content_id: "{{ series_name }} S{{ season }}E{{ episode }}"

      # If it's a Movie
      - conditions:
          - condition: template
            value_template: "{{ media_type == 'Movie' }}"
        sequence:
          - action: logbook.log
            data:
              name: "JellyHA Player"
              message: "Playing Movie: {{ title }} ({{ year }})"

          # Example: Cast or play on living room media player
          - action: media_player.play_media
            target:
              entity_id: media_player.living_room_apple_tv
            data:
              media_content_type: movie
              media_content_id: "{{ title }}"

mode: queued
max: 5
alias: "JellyHA: Play on External Player (Script)"
description: "Handles playback routing from JellyHA Library Card click actions to external media players."

# ========================================================================
# Approach 2: Event-Driven Automation (Alternative)
# ========================================================================
# The card always fires 'jellyha_item_clicked' on the Home Assistant DOM/event
# bus whenever an item is clicked, even if no service is configured.
#
# trigger:
#   - trigger: event
#     event_type: jellyha_item_clicked
# action:
#   - action: notify.persistent_notification
#     data:
#       title: "Media Selected"
#       message: "User clicked: {{ trigger.event.data.title }} ({{ trigger.event.data.media_type }})"
