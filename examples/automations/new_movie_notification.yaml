# ==============================================================================
# JellyHA Automation Example: New Content Mobile Notification
# ==============================================================================
# Description:
#   Sends an actionable mobile notification with movie artwork, technical video
#   quality badges (4K HDR/DV), runtime, and rating whenever a new movie is added
#   to your Jellyfin library.
#
# Implementation Options:
#   - Option 1 (Recommended, v1.3.0+): Direct State Trigger on `sensor.jellyha_latest_movie`
#       Instant, zero overhead, and accesses all rich metadata (resolution, dynamic
#       range, runtime, poster URL, trailer URL) directly from sensor attributes
#       without requiring any service calls.
#   - Option 2: Counter Trigger on `sensor.jellyha_unwatched_movies` + `jellyha.search`
#       Useful if you prefer triggering strictly when the unwatched count increments.
#   - Option 3: TV Episode Notification using `sensor.jellyha_latest_episode`
# ==============================================================================

# ------------------------------------------------------------------------------
# Option 1 (Recommended): Direct State Trigger on sensor.jellyha_latest_movie
# ------------------------------------------------------------------------------
alias: "JellyHA: Notify New Movie (Latest Movie Sensor)"
description: "Sends rich push notification when a new movie is detected by sensor.jellyha_latest_movie"
mode: single

trigger:
  - trigger: state
    entity_id: sensor.jellyha_latest_movie

conditions:
  # Ensure the sensor transitioned between valid movie titles (ignores restarts / unavailable)
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.to_state.state not in ['unknown', 'unavailable'] and
         trigger.to_state.state != trigger.from_state.state }}

actions:
  - action: notify.notify # Replace with your device: notify.mobile_app_<your_phone>
    data:
      title: "🎬 New Movie: {{ trigger.to_state.state }}"
      message: >
        {% set attr = trigger.to_state.attributes %}
        {{ attr.year | default('', true) }} • {{ attr.resolution | default('HD', true) }} {{ attr.dynamic_range | default('', true) }} • {{ attr.runtime_minutes | default('?', true) }} min
        ★ {{ attr.rating | default('N/A', true) }}/10

        {{ attr.overview | default('No synopsis available.', true) | truncate(160) }}
      data:
        image: "{{ trigger.to_state.attributes.poster_url }}"
        clickAction: "{{ trigger.to_state.attributes.trailer_url | default('/lovelace/media', true) }}"
        url: "{{ trigger.to_state.attributes.trailer_url | default('/lovelace/media', true) }}"

