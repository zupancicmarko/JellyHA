# ==============================================================================
# JellyHA Automation Example: Pause Movie on Doorbell
# ==============================================================================
# Description:
#   Automatically pauses active playback when a doorbell or smart doorbell sensor rings.
#   Uses the session_id dynamically resolved from the now_playing user sensor.
# ==============================================================================

alias: "JellyHA: Pause Movie on Doorbell"
description: "Pauses active Jellyfin playback when the doorbell rings"
mode: single

trigger:
  - trigger: state
    entity_id: binary_sensor.doorbell # Replace with your actual doorbell entity
    to: "on"

conditions:
  # Only run if something is currently playing for this user
  - condition: state
    entity_id: sensor.jellyha_now_playing_admin # Replace with your user sensor
    state: "playing"

actions:
  - action: jellyha.session_control
    data:
      # Dynamically get the session_id from the user sensor's attributes
      session_id: "{{ state_attr('sensor.jellyha_now_playing_admin', 'session_id') }}"
      command: "Pause"
